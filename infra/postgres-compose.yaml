services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-rag-pgvector
    environment:
      POSTGRES_DB: ai_rag_java
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_rag_pg_data:/var/lib/postgresql/data
volumes:
  ai_rag_pg_data: